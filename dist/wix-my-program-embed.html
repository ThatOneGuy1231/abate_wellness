<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" crossorigin href="https://abate-booking.vercel.app/assets/index.css">
</head>
<body>
  <div id="root"></div>
  <script>
    try { history.replaceState(null, '', '?view=my-program'); } catch(e) {}
    function syncOverflow() {
      var h = document.documentElement;
      h.style.overflowY = h.scrollHeight > h.clientHeight ? 'auto' : 'hidden';
    }
    window.addEventListener('resize', syncOverflow);
    syncOverflow();
    window.addEventListener('load', function() {
      syncOverflow();
      setTimeout(syncOverflow, 500);
      var root = document.getElementById('root');
      if (root) {
        new MutationObserver(syncOverflow).observe(root, { childList: true, subtree: true });
      }
    });
  </script>
  <script type="module" crossorigin src="https://abate-booking.vercel.app/assets/index.js"></script>
</body>
</html>
